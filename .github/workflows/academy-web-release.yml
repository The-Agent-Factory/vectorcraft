# Copy to .github/workflows/academy-web-release.yml on the `academy` branch of each fork
# (The-Agent-Factory/<app>). On a tag academy-v<upstream>-<n>, it checks the rebrand, builds
# the web zip exactly like upstream's release (same trunk, same pinned craft-fonts), post-
# processes it (strict CSP boot file, licenses/), and attaches zip + .sha256 to a GitHub release.
# Copy the sha256 into atelier-web-deploy/versions.env to deploy it. Never auto-deploys.
name: Academy web release
on:
  push:
    tags: ["academy-v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    env:
      TRUNK_VERSION: 0.21.14
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          repository: The-Agent-Factory/atelier-web-deploy
          path: deploy
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: academy-web
      - name: Install trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" trunk
      - name: Install cargo-about
        run: |
          curl -fsSL https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" --wildcards '*/cargo-about'
      - name: Build
        run: |
          APP="${GITHUB_REPOSITORY#*/}"
          OUT="$GITHUB_WORKSPACE/out" deploy/scripts/build-app.sh "$APP" app
      - name: Release
        if: startsWith(github.ref, 'refs/tags/academy-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.zip out/*.sha256 --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes "Rebranded web build for Claude Academy. See BRANDING.md."
